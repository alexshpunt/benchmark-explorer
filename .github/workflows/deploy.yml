name: Deploy public Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [dataset-updated]
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: benchmark-explorer-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: npm run check
      - run: npm run build:snapshot
      - name: Install Hugging Face Hub uploader
        run: python -m pip install --user 'huggingface_hub>=0.35,<2'
      - name: Publish static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          mkdir -p .space
          cp app.mjs core.mjs index.html .space/
          cp -R modules styles .space/
          cp dist/snapshot.json.gz dist/snapshot-manifest.json .space/
          cp -R vendor .space/vendor
          cp SPACE.md .space/README.md
          python - <<'PY'
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              folder_path=".space",
              repo_id="alexshpunt/benchmark-explorer",
              repo_type="space",
              commit_message="Deploy Explorer snapshot",
          )
          PY
