name: Deploy public Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [dataset-updated]
  schedule:
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: benchmark-explorer-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Resolve the Dataset revision and skip unchanged snapshots
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REVISION: ${{ github.event.client_payload.datasetRevision }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl --fail --silent --show-error --dump-header "$headers" --output /dev/null \
            https://huggingface.co/datasets/alexshpunt/explicit-edit-benchmark/resolve/main/dataset-index.json
          revision=$(awk 'BEGIN { IGNORECASE=1 } /^x-repo-commit:/ { gsub(/\r/, "", $2); print $2 }' "$headers")
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          if [[ -n "$REQUESTED_REVISION" && "$REQUESTED_REVISION" != "$revision" ]]; then
            echo "Ignoring stale Dataset event for $REQUESTED_REVISION; main is $revision."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=true
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            published=$(curl --fail --silent --show-error \
              https://alexshpunt-benchmark-explorer.static.hf.space/snapshot-manifest.json \
              | jq --raw-output '.revision // empty') || published=""
            if [[ "$published" == "$revision" ]]; then
              build=false
            fi
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Install browser test dependencies
        if: steps.source.outputs.build == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check reasoning across the browser views
        if: steps.source.outputs.build == 'true'
        run: npm run test:e2e
      - if: steps.source.outputs.build == 'true'
        run: npm run check
      - if: steps.source.outputs.build == 'true'
        env:
          DATASET_REVISION: ${{ steps.source.outputs.revision }}
        run: npm run build:snapshot
      - name: Install Hugging Face Hub uploader
        if: steps.source.outputs.build == 'true'
        run: python -m pip install --user 'huggingface_hub>=0.35,<2'
      - name: Publish static Space
        if: steps.source.outputs.build == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          mkdir -p .space
          cp app.mjs core.mjs index.html .space/
          cp -R modules styles .space/
          cp dist/snapshot-manifest.json .space/
          cp -R dist/snapshots .space/snapshots
          cp -R vendor .space/vendor
          cp SPACE.md .space/README.md
          python - <<'PY'
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              folder_path=".space",
              repo_id="alexshpunt/benchmark-explorer",
              repo_type="space",
              commit_message="Deploy Explorer snapshot",
          )
          PY
      - name: Verify the published revision
        if: steps.source.outputs.build == 'true'
        env:
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            published=$(curl --fail --silent --show-error \
              https://alexshpunt-benchmark-explorer.static.hf.space/snapshot-manifest.json \
              | jq --raw-output '.revision // empty') || published=""
            [[ "$published" == "$EXPECTED_REVISION" ]] && exit 0
            sleep 6
          done
          echo "Published Explorer revision did not become $EXPECTED_REVISION" >&2
          exit 1
